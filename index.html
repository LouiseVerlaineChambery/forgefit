<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ForgeFit">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>ForgeFit — Musculation</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">FORGEFIT</div>
        <h1 id="screen-title">Aujourd’hui</h1>
      </div>
      <button id="install-btn" class="ghost hidden" type="button">Installer</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Navigation principale">
      <button class="tab active" data-route="today"><span>◉</span><small>Aujourd’hui</small></button>
      <button class="tab" data-route="program"><span>▦</span><small>Programme</small></button>
      <button class="tab" data-route="history"><span>↗</span><small>Progression</small></button>
      <button class="tab" data-route="settings"><span>⚙</span><small>Réglages</small></button>
    </nav>
  </div>

  <div id="timer-sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <div class="eyebrow">REPOS</div>
      <div id="timer-value" class="timer-value">01:30</div>
      <div class="timer-actions">
        <button id="timer-minus" class="secondary" type="button">−15 s</button>
        <button id="timer-skip" class="primary" type="button">Terminer</button>
        <button id="timer-plus" class="secondary" type="button">+15 s</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
